[project]
name = "aviris-ml"
version = "0.1.0"
description = "Build an AVIRIS-Classic hyperspectral time-series multilabel dataset (California, CDL labels)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "shapely>=2.0",
    "requests>=2.31",
    "datasets>=2.19",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aviris-ml = "aviris_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviris_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
